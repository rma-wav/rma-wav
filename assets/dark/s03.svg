<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="06 — stack">
<style>
  :root{--bone:#444444;--muted:#888888;--line:#CCCCCC}
  @media (prefers-color-scheme: dark){:root{--bone:#DDDDDD;--muted:#999999;--line:#333333}}
  text{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;fill:var(--bone)}
  .t{font-size:18px;font-weight:700;letter-spacing:2px}
  .r{font-size:13px;fill:var(--muted);letter-spacing:1px}
  line{stroke:var(--line);stroke-width:1}
</style>
<text x="40" y="28" class="t">03 — STACK</text>
<text x="960" y="28" text-anchor="end" class="r">~/03-stack</text>
