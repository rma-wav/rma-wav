<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Teddy Ramadhan">
<style>
  :root{--bone:#444444;--muted:#888888;--line:#CCCCCC}
  @media (prefers-color-scheme: dark){:root{--bone:#DDDDDD;--muted:#999999;--line:#333333}}
  text{font-family:ui-monospace,SF Mono,Menlo,Consolas,monospace;fill:var(--bone)}
  .small{font-size:13px;letter-spacing:2px;fill:var(--muted)}
  .name{font-size:72px;font-weight:700;letter-spacing:-2px}
